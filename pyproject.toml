[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nuheat"
dynamic = ["version"]
description = "A Python library for the legacy NuHeat Signature and Mapei Mapeheat thermostat API (retired by the vendor in 2026; deprecated)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Derek Brooks", email = "derek@broox.com" }]
keywords = ["nuheat", "thermostat", "home automation", "python"]
requires-python = ">=3.10"
dependencies = ["requests>=2.34.2"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dev = [
    "parameterized>=0.9",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "responses>=0.25",
    "ruff>=0.8",
]

[project.urls]
Homepage = "https://github.com/broox/python-nuheat"
Issues = "https://github.com/broox/python-nuheat/issues"

[tool.hatch.version]
path = "nuheat/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["nuheat", "tests", "README.md", "LICENSE"]

[tool.ruff]
line-length = 127

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"nuheat/__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore:The legacy NuHeat:DeprecationWarning",
]
